<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Lumen <b>Studio</b></span>
    </a>

    <nav class="nav" aria-label="Main">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 11h4v6H3zM8 6h4v11H8zM13 3h4v14h-4z" /></svg>
        Overview
      </a>
      <a routerLink="/titles" routerLinkActive="is-active">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v3H3zM3 8.5h14v3H3zM3 13h14v3H3z" /></svg>
        Titles
      </a>
    </nav>

    <div class="sidebar-foot">
      <button class="theme-toggle" type="button" (click)="theme.toggle()">
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5" /><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4" /></svg>
          Light mode
        } @else {
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.8 12.2A7 7 0 0 1 7.8 3.2a7 7 0 1 0 9 9z" /></svg>
          Dark mode
        }
      </button>
      <div class="user">
        <span class="avatar" aria-hidden="true">DA</span>
        <span>
          <strong>Demo Admin</strong>
          <small>demo&#64;lumen.dev</small>
        </span>
      </div>
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>

@if (toast.message(); as message) {
  <div class="toast" [class.is-error]="message.tone === 'error'" role="status">{{ message.text }}</div>
}
